<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirish — EduSmart AI</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script>sessionStorage.flip&&(document.documentElement.className="fl")</script></head><body><main><section style="padding-top:14vh"><h1>Ro‘yxatdan o‘tish</h1><div><button class="btn" id="tr">Ro‘yxatdan o‘tish</button><button class="btn g" id="tl">Kirish</button></div>
<form class="card fm" id="fr"><label>Ismingiz</label><input id="n"><label>Yoshingiz</label><input id="a" type="number" min="7" max="99"><label>Email</label><input id="e" type="email"><label>Parol (kamida 6 belgi)</label><input id="p" type="password"><label>Yo‘nalishingiz</label><select id="d"></select><label>Bilim darajasi</label><select id="l"><option>Boshlang‘ich</option><option>O‘rta</option><option>Yuqori</option></select><label>Asosiy maqsad</label><select id="g"><option>Imtihonga tayyorlanish</option><option>Maktab darsini o‘zlashtirish</option><option>Amaliy ko‘nikma hosil qilish</option></select><p class="er" id="er"></p><button class="btn" type="submit">Ro‘yxatdan o‘tish</button></form>
<form class="card fm hide" id="fl2"><label>Email</label><input id="le" type="email"><label>Parol</label><input id="lp" type="password"><p class="er" id="er2"></p><button class="btn" type="submit">Kirish</button></form><div class="card fm hide" id="ok"></div></section></main><script src="data.js"></script><script src="app.js"></script><script>
$('#d').innerHTML=Object.keys(D).map(k=>`<option value="${k}">${D[k].n}</option>`).join('');const E=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),show=id=>['fr','fl2','ok'].forEach(i=>$('#'+i).classList.toggle('hide',i!=id));
$('#tr').onclick=()=>show('fr');$('#tl').onclick=()=>show('fl2');
function done(u){localStorage.es_me=u.e;if(u.d)localStorage.es_d=u.d;const m=u.a<12?'o‘yin va ertak tilida':u.a<17?'qiziqarli faktlar va amaliy savollar bilan':'tizimli va chuqur tahlil bilan';$('#ok').innerHTML=`<h3>Xush kelibsiz, ${E(u.n)}!</h3><p>${E((D[u.d]||{n:"Tanlangan"}).n)} yo‘nalishi bo‘yicha darslar sizga ${m} o‘tiladi. Daraja: ${E(u.l)}. Maqsad: ${E(u.g)}.</p><a class="btn" href="darsliklar.html">Darslikni ochish</a><button class="btn g" id="lo">Chiqish</button>`;show('ok');$('#lo').onclick=()=>{localStorage.removeItem('es_me');location.reload()}}
$('#fr').onsubmit=ev=>{ev.preventDefault();const u={n:$('#n').value.trim(),a:+$('#a').value,e:$('#e').value.trim().toLowerCase(),p:$('#p').value,d:$('#d').value,l:$('#l').value,g:$('#g').value},er=$('#er');
if(!u.n)return er.textContent='Ismingizni kiriting.';if(!(u.a>=7&&u.a<=99))return er.textContent='Yosh 7 dan 99 gacha bo‘lishi kerak.';if(!/^\S+@\S+\.\S+$/.test(u.e))return er.textContent='Email noto‘g‘ri.';if(u.p.length<6)return er.textContent='Parol kamida 6 belgi bo‘lsin.';if(U().some(x=>x.e==u.e))return er.textContent='Bu email ro‘yxatdan o‘tgan. “Kirish” tugmasini bosing.';
localStorage.es_users=JSON.stringify(U().concat(u));done(u)};
$('#fl2').onsubmit=ev=>{ev.preventDefault();const u=U().find(x=>x.e==$('#le').value.trim().toLowerCase()&&x.p==$('#lp').value);u?done(u):$('#er2').textContent='Email yoki parol noto‘g‘ri.'};
if(me)done(me);</script></body></html>
